services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ppat
      POSTGRES_PASSWORD: ppat
      POSTGRES_DB: ppat
    ports:
      - "5432:5432"
    volumes:
      - ppat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ppat"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://ppat:ppat@db:5432/ppat
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://ppat:ppat@db:5432/ppat
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  dashboard:
    build:
      context: ./dashboard
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

  seed:
    build:
      context: ./seed
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    profiles: ["seed"]

volumes:
  ppat_pgdata:
